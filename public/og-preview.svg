<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14161b" />
      <stop offset="50%" stop-color="#0e1013" />
      <stop offset="100%" stop-color="#090a0c" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d49757" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#d49757" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d6a8" />
      <stop offset="50%" stop-color="#e0a96d" />
      <stop offset="100%" stop-color="#c28747" />
    </linearGradient>
    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#d49757" stop-opacity="0.25" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Radial Glow Behind Center -->
  <circle cx="600" cy="300" r="450" fill="url(#glow)" />

  <!-- Outer Hairline Frame -->
  <rect x="24" y="24" width="1152" height="582" rx="28" fill="none" stroke="url(#card-border)" stroke-width="1.5" />
  <rect x="36" y="36" width="1128" height="558" rx="20" fill="none" stroke="#d49757" stroke-opacity="0.08" stroke-width="1" />

  <!-- Top Decorative Film Strip Border -->
  <g opacity="0.3" fill="#d49757">
    <rect x="60" y="50" width="18" height="12" rx="3" />
    <rect x="90" y="50" width="18" height="12" rx="3" />
    <rect x="120" y="50" width="18" height="12" rx="3" />
    <rect x="150" y="50" width="18" height="12" rx="3" />
    <rect x="180" y="50" width="18" height="12" rx="3" />
    <rect x="210" y="50" width="18" height="12" rx="3" />

    <rect x="990" y="50" width="18" height="12" rx="3" />
    <rect x="1020" y="50" width="18" height="12" rx="3" />
    <rect x="1050" y="50" width="18" height="12" rx="3" />
    <rect x="1080" y="50" width="18" height="12" rx="3" />
    <rect x="1110" y="50" width="18" height="12" rx="3" />
  </g>

  <!-- Central Visual Emblem: Stylized Film Frame + Book Pages -->
  <g transform="translate(540, 100) scale(0.48)">
    <rect x="20" y="20" width="210" height="150" rx="24" fill="none" stroke="url(#gold)" stroke-width="12" />
    <circle cx="125" cy="95" r="32" fill="none" stroke="url(#gold)" stroke-width="8" />
    <polygon points="115,80 115,110 145,95" fill="url(#gold)" />
    <!-- Book wings -->
    <path d="M 15 190 Q 125 160 125 240 Q 125 160 235 190 L 235 220 Q 125 190 125 260 Q 125 190 15 220 Z" fill="url(#gold)" opacity="0.9" />
  </g>

  <!-- Typography (Centered, High contrast, RTL friendly) -->
  <!-- Site Title -->
  <text x="600" y="275" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="800" fill="#f4f4f5" text-anchor="middle" letter-spacing="0">
    پەیڤ و ئەندێشە
  </text>

  <!-- Subtitle / Tagline -->
  <text x="600" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="500" fill="#e0a96d" text-anchor="middle">
    پانتاییەک بۆ سینەما، ئەدەب و هزری نوێ
  </text>

  <!-- Inviting Description -->
  <text x="600" y="395" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" fill="#a1a1aa" text-anchor="middle">
    ئەرشیڤێکی مۆدێرنی کوردی بۆ ناساندنی شاکارەکانی سینەما و بڵاوکردنەوەی وتاری هزری
  </text>

  <!-- Bottom Pills: Features & Telegram Link -->
  <g transform="translate(600, 480)">
    <!-- Pill 1: Cinema -->
    <g transform="translate(-240, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="18" fill="#1f232b" stroke="#3f4553" stroke-width="1" />
      <text x="0" y="6" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#d4d4d8" text-anchor="middle">
        شاکارەکانی سینەما
      </text>
    </g>

    <!-- Pill 2: Literature -->
    <g transform="translate(0, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="18" fill="#1f232b" stroke="#3f4553" stroke-width="1" />
      <text x="0" y="6" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#d4d4d8" text-anchor="middle">
        ئەدەب و فیکر
      </text>
    </g>

    <!-- Pill 3: Telegram Official -->
    <g transform="translate(240, 0)">
      <rect x="-100" y="-18" width="200" height="36" rx="18" fill="#d49757" fill-opacity="0.15" stroke="#d49757" stroke-width="1" stroke-opacity="0.5" />
      <text x="0" y="6" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#e0a96d" text-anchor="middle">
        t.me/mediay_islami
      </text>
    </g>
  </g>

  <!-- Bottom Footer Credit -->
  <text x="600" y="565" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#52525b" text-anchor="middle">
    payvandishe.com • ٢٠٢٦
  </text>
</svg>

