<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181a1f" />
      <stop offset="100%" stop-color="#0e1013" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3c88a" />
      <stop offset="100%" stop-color="#d49757" />
    </linearGradient>
    <linearGradient id="gold-subtle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d49757" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#d49757" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <rect width="508" height="508" x="2" y="2" rx="126" fill="none" stroke="url(#gold)" stroke-width="4" stroke-opacity="0.3" />

  <!-- Inner ambient glow -->
  <circle cx="256" cy="240" r="140" fill="url(#gold-subtle)" filter="blur(20px)" />

  <!-- Center Motif: Elegant stylized film reel + open book literary curve -->
  <g transform="translate(106, 106) scale(0.585)">
    <!-- Film Reel & Frame -->
    <rect x="60" y="40" width="392" height="260" rx="36" fill="none" stroke="url(#gold)" stroke-width="20" />
    
    <!-- Film Perforations (Top) -->
    <rect x="90" y="65" width="28" height="36" rx="8" fill="url(#gold)" />
    <rect x="150" y="65" width="28" height="36" rx="8" fill="url(#gold)" />
    <rect x="210" y="65" width="28" height="36" rx="8" fill="url(#gold)" />
    <rect x="270" y="65" width="28" height="36" rx="8" fill="url(#gold)" />
    <rect x="330" y="65" width="28" height="36" rx="8" fill="url(#gold)" />
    <rect x="390" y="65" width="28" height="36" rx="8" fill="url(#gold)" />

    <!-- Film Perforations (Bottom) -->
    <rect x="90" y="240" width="28" height="36" rx="8" fill="url(#gold)" />
    <rect x="150" y="240" width="28" height="36" rx="8" fill="url(#gold)" />
    <rect x="210" y="240" width="28" height="36" rx="8" fill="url(#gold)" />
    <rect x="270" y="240" width="28" height="36" rx="8" fill="url(#gold)" />
    <rect x="330" y="240" width="28" height="36" rx="8" fill="url(#gold)" />
    <rect x="390" y="240" width="28" height="36" rx="8" fill="url(#gold)" />

    <!-- Open Book / Pages under the reel -->
    <path d="M 90 350 Q 256 310 256 440 Q 256 310 422 350 L 422 410 Q 256 370 256 470 Q 256 370 90 410 Z" fill="url(#gold)" />
    
    <!-- Central Cinematic Play / Quill Triangle -->
    <polygon points="230,140 230,200 286,170" fill="url(#gold)" />
  </g>
</svg>

